<!DOCTYPE HTML>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard SOC — Мониторинг</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- Шапка -->
        <header class="header-panel">
            <div class="logo">🛡️ SOC Monitoring Hub</div>
            <nav class="user-profile">
                <span>Пользователь: <strong>Закир</strong></span>
                <button type="button" id="logout-btn">Выйти</button>
            </nav>
        </header>

        <!-- Навигация -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="#" data-page="main" class="active">Главная</a></li>
                    <li><a href="#" data-page="analytics">Аналитика</a></li>
                    <li><a href="#" data-page="logs">Логи</a></li>
                    <li><a href="#" data-page="settings">Настройки</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Контент -->
        <main class="main-content">
            <h2 id="page-title">Каталог событий / Мониторинг</h2>
            
            <div class="cards-grid" id="cards-container">
                <!-- Карточки будут динамически меняться и управляться через JS -->
            </div>
        </main>

        <!-- Футер -->
        <footer class="footer-panel">
            <p>&copy; 2026 Закир. Лабораторная работа №5.</p>
        </footer>
    </div>

    <!-- Модальное окно для деталей -->
    <div class="modal" id="details-modal">
        <div class="modal-content">
            <span class="close-btn" id="modal-close">&times;</span>
            <h3 id="modal-title">Детализация</h3>
            <hr><br>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
